digital_io:
  # Digital inputs publish std_msgs/Bool when their state changes.
  - topic_name: /reset_count
    io_index: 0
    io_type: input
  - topic_name: /task_pause
    io_index: 1
    io_type: input

  # Digital outputs subscribe to std_msgs/Bool and call the UR SetIO service.
  - topic_name: /scan3d/light      # scan lights, driven by scan_tsp_node (scan3d.light_topic)
    io_index: 0
    io_type: output
