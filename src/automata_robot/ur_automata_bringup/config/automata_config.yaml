# Cell configuration, read by every launch file. Explained in docs/configuration.md
# and docs/scan.md. After a change: colcon build --packages-select ur_automata_bringup.

robot:
  ip: 192.168.1.97         # real robot 192.168.1.97, URSim 192.168.56.101
  type: ur5                 # ur3, ur3e, ur5, ur5e, ur10, ur10e, ur16e
  # YAML from ur_calibration in this folder, read by driver and MoveIt; "" = nominal (URSim).
  # After a change, plan the scans again.
  calibration_file: ur5_calibration.yaml
  # Base pose in `world` (m, rad: roll, pitch, yaw). Non-zero adds a mounting wall
  # to the scene; a wall mount also needs the home_wall poses below.
  base_xyz: [0.0, 0.0, 0.0]
  base_rpy: [0.0, 0.0, 0.0]

planning:
  group: ur_manipulator
  global_frame: world                  # frame of the obstacles and of the scan center
  end_effector_link: ee_automata_tcp   # camera lens center, tip of the SRDF chain
  trajectory_scaling_factor: 0.4       # speed used when planning; the `speed` argument scales it
  # SRDF group_states: start / recovery pose of the upper and lower hemisphere
  # (joint values: home_wall / home_wall for a wall-mounted base).
  home_pose_name: home
  lower_home_pose_name: lower_scan_ready
  use_moveit: true
  use_scene: true
  use_rviz: true

scan:
  center: [0.133, 0.375, 0.455]  # m, top face of the platform disk; keep |center| + radius below ~0.91 m
  platform_sim: false   # true: simulated disk on 3 legs | false: the STL `platform_mesh`
  platform_mesh: platform02.stl  # in ur_automata_scene/meshes; platform01.stl and disk.stl sit 5.9 cm too high
  table_margin: 0.0     # m, keep-out slab on the table (0.02 already loses the waypoints under the disk)
  # Keep-out volumes around the real platform (m, platform_sim false only).
  keepouts:
    stem_base: {enabled: true, diameter: 0.14, height: 0.10}
    stem:      {enabled: true, diameter: 0.08, height: 0.23}
    disk:      {enabled: true, diameter: 0.34, height: 0.005}
    support:   {enabled: true, margin: 0.01}

  # Cell walls in the global frame (m, 0 = none), never in front.
  # Limits: back_y >= -0.42 (elbow at home), right_x >= 0.75 (end effector at lower_scan_ready).
  walls:
    back_y: -0.47
    left_x: -0.52
    right_x: 0.76
    top_z: 0.97     # ceiling: above the highest waypoint plus the end effector
  radius: 0.25              # m
  hemisphere: full          # upper | lower | full (upper first)
  direction: latitudinal    # latitudinal | longitudinal

  # No waypoints within this angle of the equator (deg).
  equator_exclusion_upper_deg: 15.0
  equator_exclusion_lower_deg: 20.0

  num_rings: 4              # latitudinal: rings between pole and equator
  points_per_ring: 15
  num_arc: 5                # longitudinal: meridians
  points_per_arc: 4

  lock_pitch: false      # true: camera X axis horizontal; false: rotation about the optical axis searched
  stagger_rings: true    # even rings shifted by half a step
  adaptive_rings: true   # points per ring scale with sin(theta)
  occlusion_check: true  # drop IK solutions where the arm hides the platform disk
  occlusion_disk_radius: 0.15   # m
  occlusion_margin: 0.01        # m, closest a link may come to a line of sight
  fallback_search: true  # look for a nearby point when a waypoint has no IK
  fallback_radius_mm: 20.0

  # lock_pitch false: offsets tried about the optical axis; bias = DP cost per rad of offset.
  pitch_search_range_deg: 180.0
  pitch_search_step_deg:  15.0
  pitch_xparallel_bias:   0.05

  enum_ik_timeout: 0.003    # s per IK call of the candidate enumeration

  # Planner chain per segment, first success wins: pilz_circ | pilz_ptp | ompl.
  planners: [pilz_ptp, ompl]
  ompl_algorithm: RRTstar
  planning_time: 15.0                 # s per OMPL request
  retry_planning_times: [30.0, 60.0]  # s, retries before the recovery pose ([] = none)
  retry_ompl_algorithm: RRTConnect    # gets through narrow passages where RRTstar does not
  planning_attempts: 3                # parallel OMPL attempts, the best path is kept

  # Visit order (docs/scan.md, "Sectors and arm swings").
  sectors: 4                # azimuth slices per hemisphere, 0 = ring by ring
  sector_offset_deg: 45.0
  joint_cost_weight: 0.1    # DP cost = elbow path + TCP path (m) + this x joint distance (rad)
  swing_threshold_m: 0.25   # elbow travel counted as an arm swing

  # Recording of scan_sequence_node (record:=true), played by scan_replay_node.
  recording_file: /home/ros/ur/recordings/scan_sequence.yaml

# 3D scan topics (scan_tsp_node, std_msgs/String). MQTT names in mqtt_bridge.yaml:
# change both together. Messages in docs/mqtt.md.
scan3d:
  start_topic:    /scan3d/start      # in:  object name
  capture_topic:  /scan3d/acquire    # out: photo request with the camera pose
  status_topic:   /scan3d/status     # in:  camera state (JSON)
  done_topic:     /scan3d/done       # out: "scan3D <object>" (+ " ERROR")
  wait_for_next:  true               # false: do not wait for the camera
  light_topic:    /scan3d/light      # out: std_msgs/Bool, lights on DO0 during the scan; "" = none.
                                     #      Same name as in ur_io_ros2_manager/config/config.yaml

# HSI measurement (ur_automata_hsi). Speed: the `speed` launch argument, as the scan.
hsi:
  link:           ee_automata_hsi    # sensor frame in the URDF
  distance:       0.30               # m, from scan.center
  start_topic:    /hsi/start         # in:  object name
  acquire_topic:  /hsi/acquire       # out: measurement request with the HSI pose
  status_topic:   /hsi/status        # in:  HSI app state (JSON)
  done_topic:     /hsi/done          # out: "hsi <object>" (+ " ERROR")
  wait_for_hsi:   true               # false: no HSI app, wait wait_s at the pose
  wait_s:         3.0

# Digital I/O mapping: src/utils/ur_io_ros2_manager/config/config.yaml.
