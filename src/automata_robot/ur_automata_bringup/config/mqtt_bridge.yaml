# ROS <-> MQTT bridge (ika-rwth-aachen/mqtt_client) for scan and HSI.
# ROS names must match the scan3d: and hsi: sections of automata_config.yaml.
# Start and done are separate MQTT topics, or the bridge would get back its own
# done as a new start. primitive: a plain text payload made only of a number or
# true/false arrives as Int32/Bool, not String.
/**/*:
  ros__parameters:
    broker:
      host: localhost      # PC running Mosquitto
      port: 1883
    bridge:
      ros2mqtt:
        ros_topics:
          - /scan3d/acquire
          - /scan3d/done
          - /hsi/acquire
          - /hsi/done
        /scan3d/acquire:
          mqtt_topic: vimbax/commands
          primitive: true
          ros_type: std_msgs/msg/String
          advanced:
            mqtt:
              qos: 1
        /scan3d/done:
          mqtt_topic: automata/scan3d/done
          primitive: true
          ros_type: std_msgs/msg/String
          advanced:
            mqtt:
              qos: 1
        /hsi/acquire:
          mqtt_topic: hsi/commands
          primitive: true
          ros_type: std_msgs/msg/String
          advanced:
            mqtt:
              qos: 1
        /hsi/done:
          mqtt_topic: automata/hsi/done
          primitive: true
          ros_type: std_msgs/msg/String
          advanced:
            mqtt:
              qos: 1
      mqtt2ros:
        mqtt_topics:
          - vimbax/status
          - automata/scan3d/start
          - hsi/status
          - automata/hsi/start
        vimbax/status:
          ros_topic: /scan3d/status
          primitive: true
          advanced:
            mqtt:
              qos: 1
        automata/scan3d/start:
          ros_topic: /scan3d/start
          primitive: true
          advanced:
            mqtt:
              qos: 1
        hsi/status:
          ros_topic: /hsi/status
          primitive: true
          advanced:
            mqtt:
              qos: 1
        automata/hsi/start:
          ros_topic: /hsi/start
          primitive: true
          advanced:
            mqtt:
              qos: 1
